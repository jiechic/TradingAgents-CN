name: Publish TradingAgents 3.0 images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-v3
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: local/backend:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=v3-backend-${{ matrix.arch }}
          cache-to: type=gha,scope=v3-backend-${{ matrix.arch }},mode=max
      - name: Validate backend imports
        run: |
          docker run --rm -e DEBUG=true -e JWT_SECRET=ci-test-only-secret-at-least-32-characters -e CSRF_SECRET=ci-test-only-csrf-at-least-32-characters --entrypoint python local/backend:test -c 'import app.main; import migrations.runner; print("Backend imports OK")'
      - name: Build frontend for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: local/frontend:test
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=v3-frontend-${{ matrix.arch }}
          cache-to: type=gha,scope=v3-frontend-${{ matrix.arch }},mode=max
      - name: Validate frontend serves SPA
        run: |
          docker network create smoke
          docker run -d --name backend --network smoke --entrypoint sleep local/backend:test 120
          docker run -d --name frontend --network smoke -p 18080:80 local/frontend:test
          for attempt in $(seq 1 15); do
            if curl -fsS http://localhost:18080/ > /tmp/page; then break; fi
            sleep 2
          done
          grep -q '<html' /tmp/page
          curl -fsS http://localhost:18080/login > /dev/null
      - name: Publish validated architecture images
        env:
          OWNER: ${{ github.repository_owner }}
          ARCH: ${{ matrix.arch }}
        run: |
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/tradingagents-v3-$component"
            docker tag "local/$component:test" "$image:v3.0.0-$ARCH"
            docker push "$image:v3.0.0-$ARCH"
          done
  manifests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture release tags
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          for component in backend frontend; do
            image="ghcr.io/${OWNER,,}/tradingagents-v3-$component"
            docker buildx imagetools create -t "$image:v3.0.0" "$image:v3.0.0-amd64" "$image:v3.0.0-arm64"
            docker buildx imagetools inspect "$image:v3.0.0"
          done
