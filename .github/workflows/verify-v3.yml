name: Verify published TradingAgents images
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag; empty reads VERSION'
        required: false
        default: ''
  workflow_call:
    inputs:
      image_tag:
        type: string
        required: true
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run full-stack startup, version, recovery and login checks
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: bash tools/smoke_images.sh
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs backend --tail 100 || true
          docker logs frontend --tail 40 || true
