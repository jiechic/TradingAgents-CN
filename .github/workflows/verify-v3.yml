name: Verify published TradingAgents 3.0
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: ci-mongo-only
        ports: ['27017:27017']
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start published backend against disposable databases
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          docker run -d --name ta-v3-backend --network host \
            -e DEBUG=false \
            -e MONGODB_HOST=127.0.0.1 -e MONGODB_PORT=27017 \
            -e MONGODB_USERNAME=admin -e MONGODB_PASSWORD=ci-mongo-only \
            -e MONGODB_DATABASE=tradingagents_ci -e MONGODB_AUTH_SOURCE=admin \
            -e 'MONGODB_CONNECTION_STRING=mongodb://admin:ci-mongo-only@127.0.0.1:27017/tradingagents_ci?authSource=admin' \
            -e REDIS_HOST=127.0.0.1 -e REDIS_PORT=6379 \
            -e JWT_SECRET=ephemeral-ci-jwt-secret-unique-not-for-deployment-12345 \
            -e CSRF_SECRET=ephemeral-ci-csrf-secret-unique-not-for-deployment-67890 \
            -e ADMIN_DEFAULT_PASSWORD=Ephemeral-CI-Admin-Only-12345 \
            "ghcr.io/${OWNER,,}/tradingagents-v3-backend:v3.0.0"
          ready=false
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health > /tmp/health.json; then ready=true; break; fi
            sleep 5
          done
          test "$ready" = true
          python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["success"] and d["data"]["status"]=="ok"; print(d["data"])'
      - name: Verify bootstrap and migration status
        run: |
          curl -fsS -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            --data '{"username":"admin","password":"Ephemeral-CI-Admin-Only-12345"}' > /tmp/login.json
          python -c 'import json;d=json.load(open("/tmp/login.json"));assert d.get("success"),d.get("message");print("Fresh administrator login passed")'
          docker exec ta-v3-backend python -m migrations.cli status
      - name: Backend diagnostics
        if: always()
        run: docker logs ta-v3-backend --tail 120 || true
